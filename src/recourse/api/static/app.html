<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>KEEPR — Workspace</title>
<link rel="stylesheet" href="/static/css/keepr.css"/>
<link rel="stylesheet" href="/static/css/app.css"/>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <a href="/" class="t-logo"><div class="t-mark">K</div><div class="t-name">KEEPR</div></a>
    <div class="t-sep"></div>
    <div class="t-job" id="t-job">AR-50 · accounts-receivable-reconciliation</div>
    <div class="t-state">
      <div class="t-health">
        <div class="t-dot" id="dot-worker" title="Worker"></div>
        <div class="t-dot" id="dot-ledger" title="Ledger"></div>
      </div>
      <div class="t-chip t-chip-standby" id="t-state-chip">STANDBY</div>
      <div class="t-esc-badge" id="t-esc" title="Escalations" style="display:none">
        <span class="badge-num" id="t-esc-num">0</span>
      </div>
      <a href="/" class="t-back">← Landing</a>
    </div>
  </header>

  <div class="body">
    <nav class="sidenav" id="sidenav">
      <button class="nav-btn active" data-view="overview" aria-label="Job Control">
        ◉<span class="nav-tooltip">Job Control</span>
      </button>
      <button class="nav-btn" data-view="work" aria-label="Work">
        ▦<span class="nav-tooltip">Work</span>
      </button>
      <div class="nav-sep"></div>
      <button class="nav-btn" data-view="lab" aria-label="Break the Job">
        ⚡<span class="nav-tooltip">Break the Job</span>
      </button>
      <button class="nav-btn" data-view="authority" aria-label="Authority">
        ⊘<span class="nav-tooltip">Authority</span>
      </button>
      <button class="nav-btn" data-view="verification" aria-label="Verification">
        ✓<span class="nav-tooltip">Verification</span>
      </button>
      <button class="nav-btn" data-view="escalations" aria-label="Escalations">
        ↑<span class="nav-tooltip">Escalations</span>
      </button>
    </nav>

    <main class="main" id="main">
      <div class="view active" id="view-overview"></div>
      <div class="view" id="view-work"></div>
      <div class="view" id="view-lab"></div>
      <div class="view" id="view-authority"></div>
      <div class="view" id="view-verification"></div>
      <div class="view" id="view-escalations"></div>
    </main>
  </div>
</div>

<div class="tooltip" id="tooltip"></div>
<div class="drawer-overlay" id="drawer-overlay"></div>
<div class="drawer" id="drawer">
  <div class="drawer-header">
    <div class="dh-title" id="drawer-title">Invoice Trace</div>
    <button class="dh-close" id="drawer-close" aria-label="Close">✕</button>
  </div>
  <div class="drawer-meta" id="drawer-meta"></div>
  <div class="drawer-timeline" id="drawer-timeline"></div>
</div>

<script type="module" src="/static/js/api.js"></script>
<script type="module" src="/static/js/actors.js"></script>
<script type="module" src="/static/js/trace.js"></script>
<script type="module" src="/static/js/workfield.js"></script>
<script type="module" src="/static/js/views.js"></script>
<script type="module" src="/static/js/app.js"></script>
</body>
</html>
